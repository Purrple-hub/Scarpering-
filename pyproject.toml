[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scarpering"
version = "1.0.0"
description = "Advanced asynchronous web crawler with adaptive rate limiting, deduplication, and GUI"
readme = "README.md"
authors = [{ name = "Purrple-hub" }]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "PyQt6",
    "curl-cffi",
    "selectolax",
    "aiofiles",
    "aiosqlite",
    "psutil",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "flake8>=6.0",
    "black>=23.0",
]

[project.scripts]
scarper = "main:main"   # Creates a command-line entry point `scarper`

[tool.setuptools.packages.find]
include = ["crawler*", "gui*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.flake8]
max-line-length = 127
max-complexity = 10
extend-ignore = ["E203", "W503"]
